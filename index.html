<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodnight ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
  }

  body {
    background:
      radial-gradient(circle at 50% 25%, rgba(70,35,70,.35), transparent 30%),
      linear-gradient(#070815 0%, #11102b 48%, #180914 100%);
    color: #fff3f0;
  }

  .night {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 650px;
    overflow: hidden;
    isolation: isolate;
  }

  /* Stars */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(255,255,255,.85) 1px, transparent 1.5px),
      radial-gradient(circle, rgba(255,220,230,.65) 1px, transparent 1.5px);
    background-size: 95px 95px, 145px 145px;
    background-position: 10px 20px, 50px 70px;
    opacity: .65;
    animation: twinkle 4s ease-in-out infinite alternate;
    z-index: -5;
  }

  @keyframes twinkle {
    from { opacity: .35; }
    to { opacity: .8; }
  }

  /* Moon */
  .moon {
    position: absolute;
    top: 7vh;
    left: 50%;
    width: min(190px, 30vw);
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    background:
      radial-gradient(circle at 32% 30%, rgba(255,255,255,.95) 0 3%, transparent 4%),
      radial-gradient(circle at 68% 65%, rgba(110,85,95,.20) 0 8%, transparent 9%),
      radial-gradient(circle at 38% 65%, rgba(90,70,85,.16) 0 6%, transparent 7%),
      radial-gradient(circle at 65% 30%, rgba(100,80,90,.12) 0 5%, transparent 6%),
      #f5d8d0;
    box-shadow:
      0 0 25px rgba(255,205,195,.75),
      0 0 80px rgba(255,170,170,.35);
    animation: moonGlow 4s ease-in-out infinite alternate;
    z-index: -3;
  }

  @keyframes moonGlow {
    from { box-shadow: 0 0 25px rgba(255,205,195,.7), 0 0 60px rgba(255,170,170,.25); }
    to { box-shadow: 0 0 35px rgba(255,220,210,.9), 0 0 100px rgba(255,150,170,.4); }
  }

  /* Soft clouds */
  .cloud {
    position: absolute;
    width: 240px;
    height: 45px;
    border-radius: 50%;
    background: rgba(110,55,75,.18);
    filter: blur(12px);
    z-index: -2;
  }
  .cloud.one { top: 25%; left: -40px; animation: drift 18s linear infinite; }
  .cloud.two { top: 35%; right: -80px; animation: driftReverse 23s linear infinite; }
  .cloud.three { top: 48%; left: 25%; opacity: .6; animation: drift 28s linear infinite; }

  @keyframes drift {
    from { transform: translateX(-80px); }
    to { transform: translateX(calc(100vw + 300px)); }
  }
  @keyframes driftReverse {
    from { transform: translateX(80px); }
    to { transform: translateX(calc(-100vw - 300px)); }
  }

  /* Fireflies */
  .fireflies { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .fly {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffd76a;
    box-shadow: 0 0 8px 3px rgba(255,207,80,.8);
    animation: fly 6s ease-in-out infinite;
  }

  .fly:nth-child(1) { left: 7%; top: 62%; animation-delay: -.4s; }
  .fly:nth-child(2) { left: 15%; top: 45%; animation-delay: -2s; }
  .fly:nth-child(3) { left: 23%; top: 68%; animation-delay: -4s; }
  .fly:nth-child(4) { left: 31%; top: 54%; animation-delay: -1s; }
  .fly:nth-child(5) { left: 39%; top: 72%; animation-delay: -3s; }
  .fly:nth-child(6) { left: 47%; top: 58%; animation-delay: -5s; }
  .fly:nth-child(7) { left: 55%; top: 76%; animation-delay: -1.5s; }
  .fly:nth-child(8) { left: 63%; top: 50%; animation-delay: -3.5s; }
  .fly:nth-child(9) { left: 71%; top: 65%; animation-delay: -.8s; }
  .fly:nth-child(10) { left: 79%; top: 44%; animation-delay: -2.5s; }
  .fly:nth-child(11) { left: 87%; top: 70%; animation-delay: -4.5s; }
  .fly:nth-child(12) { left: 93%; top: 55%; animation-delay: -1.8s; }
  .fly:nth-child(13) { left: 10%; top: 78%; animation-delay: -3.2s; }
  .fly:nth-child(14) { left: 28%; top: 82%; animation-delay: -.9s; }
  .fly:nth-child(15) { left: 69%; top: 82%; animation-delay: -2.8s; }
  .fly:nth-child(16) { left: 82%; top: 76%; animation-delay: -4.1s; }

  .fly:nth-child(17) { left: 4%; top: 35%; animation-delay: -2.7s; }
  .fly:nth-child(18) { left: 12%; top: 58%; animation-delay: -5.2s; }
  .fly:nth-child(19) { left: 19%; top: 75%; animation-delay: -1.3s; }
  .fly:nth-child(20) { left: 26%; top: 42%; animation-delay: -4.7s; }
  .fly:nth-child(21) { left: 34%; top: 63%; animation-delay: -2.2s; }
  .fly:nth-child(22) { left: 42%; top: 48%; animation-delay: -5.8s; }
  .fly:nth-child(23) { left: 50%; top: 69%; animation-delay: -3.9s; }
  .fly:nth-child(24) { left: 58%; top: 43%; animation-delay: -1.7s; }
  .fly:nth-child(25) { left: 66%; top: 73%; animation-delay: -4.9s; }
  .fly:nth-child(26) { left: 74%; top: 57%; animation-delay: -2.6s; }
  .fly:nth-child(27) { left: 81%; top: 36%; animation-delay: -5.4s; }
  .fly:nth-child(28) { left: 89%; top: 62%; animation-delay: -3.1s; }
  .fly:nth-child(29) { left: 96%; top: 46%; animation-delay: -1.1s; }
  .fly:nth-child(30) { left: 6%; top: 84%; animation-delay: -4.3s; }
  .fly:nth-child(31) { left: 17%; top: 52%; animation-delay: -3.6s; }
  .fly:nth-child(32) { left: 30%; top: 88%; animation-delay: -5.1s; }
  .fly:nth-child(33) { left: 44%; top: 81%; animation-delay: -2.9s; }
  .fly:nth-child(34) { left: 57%; top: 88%; animation-delay: -4.6s; }
  .fly:nth-child(35) { left: 72%; top: 87%; animation-delay: -1.9s; }
  .fly:nth-child(36) { left: 85%; top: 84%; animation-delay: -3.4s; }
  .fly:nth-child(37) { left: 94%; top: 78%; animation-delay: -5.6s; }
  .fly:nth-child(38) { left: 37%; top: 35%; animation-delay: -2.4s; }
  .fly:nth-child(39) { left: 63%; top: 34%; animation-delay: -4.0s; }
  .fly:nth-child(40) { left: 91%; top: 29%; animation-delay: -1.5s; }

  @keyframes fly {
    0%,100% { transform: translate(0,0); opacity: .25; }
    25% { transform: translate(25px,-35px); opacity: 1; }
    50% { transform: translate(-18px,-65px); opacity: .55; }
    75% { transform: translate(35px,-25px); opacity: 1; }
  }

  /* Message */
  .message {
    position: absolute;
    top: 33%;
    left: 50%;
    transform: translateX(-50%);
    width: min(850px, 90vw);
    text-align: center;
    z-index: 4;
    animation: appear 2s ease both;
  }

  .message h1 {
    margin: 0 0 18px;
    font-size: clamp(3rem, 8vw, 6.5rem);
    font-weight: 400;
    font-style: italic;
    letter-spacing: 2px;
    color: #ffe9e2;
    text-shadow: 0 0 15px rgba(255,150,150,.75), 0 0 35px rgba(120,20,40,.7);
  }

  .heart {
    color: #8f1027;
    font-size: 2rem;
    animation: heartbeat 1.4s infinite;
    display: inline-block;
  }

  .message p {
    margin: 14px auto;
    max-width: 720px;
    font-size: clamp(1.05rem, 2.2vw, 1.5rem);
    line-height: 1.8;
    color: #f9dedb;
    text-shadow: 0 2px 12px #000;
  }

  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    15% { transform: scale(1.25); }
    30% { transform: scale(1); }
    45% { transform: scale(1.18); }
  }

  @keyframes appear {
    from { opacity: 0; transform: translate(-50%, 25px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* Ground */
  .ground {
    position: absolute;
    left: -10%;
    bottom: -12%;
    width: 120%;
    height: 38%;
    border-radius: 50% 50% 0 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(120,25,45,.25), transparent 45%),
      linear-gradient(#180911, #070507);
    box-shadow: 0 -20px 80px rgba(100,10,30,.22);
    z-index: 2;
  }

  /* CSS teddy bear */
  .bear {
    position: absolute;
    bottom: 3%;
    left: 50%;
    width: 230px;
    height: 260px;
    transform: translateX(-50%);
    z-index: 7;
    filter: drop-shadow(0 12px 20px rgba(0,0,0,.65));
    animation: bearFloat 4s ease-in-out infinite;
  }

  @keyframes bearFloat {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-7px); }
  }

  .ear, .head, .body, .arm, .leg {
    position: absolute;
    background: #520817;
    border: 3px solid #30040e;
  }

  .ear {
    width: 65px; height: 65px;
    border-radius: 50%;
    top: 5px;
  }
  .ear.left { left: 15px; }
  .ear.right { right: 15px; }

  .ear::after {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: #741027;
  }

  .head {
    width: 160px; height: 140px;
    border-radius: 48% 48% 45% 45%;
    left: 35px; top: 30px;
    z-index: 2;
    box-shadow: inset 0 -12px 18px rgba(0,0,0,.25);
  }

  .body {
    width: 150px; height: 130px;
    border-radius: 48% 48% 42% 42%;
    left: 40px; top: 130px;
  }

  .eye {
    position: absolute;
    top: 55px;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #090308;
    box-shadow: 0 0 5px #fff;
  }
  .eye.left { left: 45px; }
  .eye.right { right: 45px; }

  .muzzle {
    position: absolute;
    left: 52px; top: 72px;
    width: 56px; height: 45px;
    border-radius: 50%;
    background: #76182a;
  }

  .nose {
    position: absolute;
    left: 21px; top: 9px;
    width: 15px; height: 11px;
    border-radius: 50%;
    background: #160208;
  }

  .mouth {
    position: absolute;
    left: 27px; top: 19px;
    width: 3px; height: 12px;
    background: #26030b;
  }

  .arm {
    width: 55px; height: 115px;
    border-radius: 50%;
    top: 138px;
    z-index: 4;
  }
  .arm.left { left: 7px; transform: rotate(18deg); }
  .arm.right { right: 7px; transform: rotate(-18deg); }

  .leg {
    width: 75px; height: 70px;
    border-radius: 50%;
    bottom: -18px;
    z-index: 1;
  }
  .leg.left { left: 18px; }
  .leg.right { right: 18px; }

  /* Roses */
  .roses {
    position: absolute;
    z-index: 6;
    left: 50%;
    top: 145px;
    transform: translateX(-50%);
    width: 125px;
    height: 100px;
  }

  .rose {
    position: absolute;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 45% 45%, #2d0209 0 12%, transparent 13%),
      repeating-conic-gradient(from 15deg, #9e1732 0 12deg, #510513 13deg 25deg);
    box-shadow: 0 0 9px rgba(150,10,35,.65);
    animation: rosePulse 3s ease-in-out infinite;
  }
  .rose:nth-child(1) { left: 8px; top: 25px; }
  .rose:nth-child(2) { left: 45px; top: 5px; animation-delay: -.8s; }
  .rose:nth-child(3) { left: 76px; top: 28px; animation-delay: -1.5s; }
  .rose:nth-child(4) { left: 34px; top: 45px; animation-delay: -2.1s; }

  @keyframes rosePulse {
    0%,100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.08) rotate(4deg); }
  }

  .stem {
    position: absolute;
    width: 4px; height: 50px;
    background: #183b20;
    transform: rotate(-20deg);
    left: 58px; top: 45px;
    z-index: -1;
  }

  .petal {
    position: absolute;
    width: 10px; height: 18px;
    border-radius: 50%;
    background: #720d23;
    opacity: .8;
    animation: fall 7s linear infinite;
    z-index: 5;
  }

  .petal:nth-child(1) { left: 20%; top: -20px; animation-delay: -1s; }
  .petal:nth-child(2) { left: 35%; top: -80px; animation-delay: -4s; }
  .petal:nth-child(3) { left: 65%; top: -50px; animation-delay: -2s; }
  .petal:nth-child(4) { left: 78%; top: -120px; animation-delay: -5s; }

  @keyframes fall {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    15% { opacity: .9; }
    100% { transform: translateY(70vh) rotate(260deg); opacity: 0; }
  }

  .signature {
    position: absolute;
    bottom: 1.2rem;
    width: 100%;
    text-align: center;
    color: rgba(255,220,220,.6);
    font-size: .8rem;
    letter-spacing: 2px;
    z-index: 10;
  }

  @media (max-width: 600px) {
    .message { top: 31%; }
    .message p { line-height: 1.55; }
    .moon { top: 8%; width: 145px; }
    .bear { transform: translateX(-50%) scale(.82); transform-origin: bottom center; bottom: 1%; }
    @keyframes bearFloat {
      0%,100% { transform: translateX(-50%) scale(.82) translateY(0); }
      50% { transform: translateX(-50%) scale(.82) translateY(-7px); }
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="night">
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="cloud one"></div>
  <div class="cloud two"></div>
  <div class="cloud three"></div>

  <div class="fireflies" aria-hidden="true">
    <span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span><span class="fly"></span>
  </div>

  <section class="message">
    <h1>Goodnight <span class="heart">♥</span></h1>
    <p>
      I hope you have a good sleep<br>
      and that I'm here for you no matter what.<br>
      I won't leave your side.
    </p>
  </section>

  <div class="ground"></div>

  <div class="petal"></div><div class="petal"></div>
  <div class="petal"></div><div class="petal"></div>

  <div class="bear" aria-label="Dark red teddy bear holding dark red roses">
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="muzzle"><div class="nose"></div><div class="mouth"></div></div>
    </div>
    <div class="body"></div>
    <div class="arm left"></div>
    <div class="arm right"></div>
    <div class="leg left"></div>
    <div class="leg right"></div>

    <div class="roses">
      <div class="stem"></div>
      <div class="rose"></div><div class="rose"></div>
      <div class="rose"></div><div class="rose"></div>
    </div>
  </div>

  <div class="signature">made with love ❤️</div>
</div>
</body>
</html>
